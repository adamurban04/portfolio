# Welcome to Jekyll!


# DEPLOYING THE SITE TO GITHUB PAGES: (baseurl = "portfolio") (if changes were made for example for assets otherwise not needed)
# bundle exec jekyll build 


# SERVING THE SITE LOCALLY: (baseurl = "")
# bundle exec jekyll serve --config _config.yml,_config_dev.yml

# LOCATE THE THEME FILES
# bundle info --path minima





