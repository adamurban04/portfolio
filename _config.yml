# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: "Adam Urban"
email: adamurban73@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Check out my GitHub / LinkedIn.
# Conditional baseurl
baseurl: "/portfolio"
url: https://adamurban04.github.io
permalink: /:categories/:title/
# twitter_username: jekyllrb
linkedin_username: adamurban73
github_username:  adamurban04

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-google_search_console_verification_file
  - jekyll-sitemap

minima:
  nav_pages:
    - contact-me.markdown
    - about.markdown
    


google_search_console:
  verification_file_code: 315ef566293b6467

